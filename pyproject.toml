[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "admmtor"
version = "0.1.0"
description = "ADMM-based deconvolution and restoration algorithms in PyTorch"
authors = [{ name = "george.grosu.florin@gmail.com" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==1.26.4",
    "opencv-python==4.10.0.82",
    "pandas==2.2.2",
    "prettytable==3.16.0",
    "scipy==1.14.1",
    "torch==2.12.0+cu126",
    "torchmetrics==1.8.2",
    "torchvision==0.27.0+cu126",
    "tqdm==4.66.5",
    "bm3d==4.0.3",
    "kornia==0.8.1",
    "einops==0.8.2",
    "timm==1.0.24",
    "matplotlib",
    "seaborn",
    "scikit-image"
]

[project.optional-dependencies]
dev = [
    "ipykernel",
    "pytest",
    "ruff"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["admmtor*"]

[tool.setuptools.package-dir]
"" = "src"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true  # CRITICAL: Prevents uv from looking here for normal packages like torchmetrics

# 2. Pin torch and torchvision to only use that explicit index
[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
